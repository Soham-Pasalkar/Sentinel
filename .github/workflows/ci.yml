name: CI

on:
  push:
    # `c01-project-scaffold` is the current development branch; there is no
    # `main` yet. A pull request from it would also run the pull_request
    # trigger below, so expect two runs for the same commit in that case.
    branches: [main, c01-project-scaffold]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python-version }})
    # Linux and macOS are the supported platforms for path-constrained tools (D-21).
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -c constraints-dev.txt
      - name: Run tests
        run: pytest
